Gearbox:
- insert screws in opposite order without tightening them
- then go one more time after all in the same order, doing final tightening
- this ensures part is assembled with equal distribution of force

  - no notion of having some XT30/XT60 ports assembled into the motor housing to prevent those wires fro being pulled

  - so in original robot those cables just dangle freely attached by ziplocks

Hot inserting:
- Iron by default warms up to its max (350deg). This is definitely too much for hot inserting screw nuts into PLA.
- I found 220-230 degrees temperatores to be good.
- Let it warm up, even ifit says it reached given temperatore tip didn't.
- If tip is too cold, nut under the pressure will start to go in, but around it there will be "crater". Attach photo.
- IF tip is too warm, plastic will be pushing nut out, and will go outside on its own too, bulging around.
  In such case plastic around nuts looses its structural integrity becoming semi-liquid, it's thus easy in such case for a mistake like skewed nut.
  To fix such situation you will need to slightly screw in screw from the other side (or if impossible just push it till it touches nut).
  Then hold nut between that screw and hot iron, and move the surrounding plastic part to correct nut orientation relative to it.
  Screw should then be able to slide in, and few turns should be able to be made.
  This can avoid few hours of reprinting the part, but in general its of course better to just use correct temperature.
- Don't apply too much pressure, just slight one. Let plastic melt on its own and slowly absorb the nut. (attach video).
